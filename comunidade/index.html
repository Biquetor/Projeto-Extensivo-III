<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão da Comunidade - Mapa & Agendamentos</title>
  
  <!-- Estilos do Leaflet (Mapa OpenSource) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
    h1 { color: #333; }
    #container { display: flex; gap: 20px; flex-wrap: wrap; }
    #map { height: 450px; width: 60%; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
    #form-container { width: 35%; min-width: 300px; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select, button { width: 100%; padding: 8px; box-sizing: border-box; }
    button { background-color: #28a745; color: white; border: none; cursor: pointer; border-radius: 4px; font-size: 16px; }
    button:hover { background-color: #218838; }
  </style>
</head>
<body>

  <h1>Mapa de Espaços Públicos & Agendamentos</h1>

  <div id="container">
    <!-- Div para o Mapa -->
    <div id="map"></div>

    <!-- Formulário de Agendamento -->
    <div id="form-container">
      <h3>Novo Agendamento</h3>
      <form id="agendamentoForm">
        <div class="form-group">
          <label for="usuarioId">ID do Usuário:</label>
          <input type="number" id="usuarioId" required placeholder="Ex: 1">
        </div>

        <div class="form-group">
          <label for="espacoId">Espaço Público:</label>
          <select id="espacoId" required>
            <option value="">Carregando espaços...</option>
          </select>
        </div>

        <div class="form-group">
          <label for="dataInicio">Início:</label>
          <input type="datetime-local" id="dataInicio" required>
        </div>

        <div class="form-group">
          <label for="dataFim">Fim:</label>
          <input type="datetime-local" id="dataFim" required>
        </div>

        <button type="submit">Confirmar Agendamento</button>
      </form>
    </div>
  </div>

  <!-- Scripts do Leaflet e Lógica do App -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
